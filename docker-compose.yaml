services:
  api:
    build:
      context: .
    image: kubernetes-lab-api:local
    container_name: kubernetes-lab-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-kubernetes_lab}"
      DB_USER: "${POSTGRES_USER:-kubernetes_lab}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-change-me-before-deployment}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - database

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-kubernetes_lab}"
      POSTGRES_USER: "${POSTGRES_USER:-kubernetes_lab}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-before-deployment}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
