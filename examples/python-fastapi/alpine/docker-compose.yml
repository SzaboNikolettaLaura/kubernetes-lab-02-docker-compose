services:
  pastebin:
    build: .
    image: lighthouse.tohka.us/example-projects/pastebin-python:alpine
    container_name: pastebin-python-alpine
    ports:
      - "8001:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status==200 else sys.exit(1)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
