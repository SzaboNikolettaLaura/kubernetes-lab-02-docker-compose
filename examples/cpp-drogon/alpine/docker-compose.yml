services:
  pastebin:
    build: .
    image: lighthouse.tohka.us/example-projects/pastebin-cpp:alpine
    container_name: pastebin-cpp-alpine
    ports:
      - "8301:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
