services:
  pastebin:
    build: .
    image: lighthouse.tohka.us/example-projects/pastebin-cpp:debian
    container_name: pastebin-cpp-debian
    ports:
      - "8300:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
