services:
  pastebin:
    build: .
    image: lighthouse.tohka.us/example-projects/pastebin-csharp:debian
    container_name: pastebin-csharp-debian
    ports:
      - "8200:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
